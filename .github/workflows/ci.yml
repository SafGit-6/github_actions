name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest test_app.py

      # --- NEW: Docker Phase ---
      - name: Build Docker image
        run: docker build -t my-python-app:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-python-app:latest'
          format: 'table'
          exit-code: '0' # Change 1 to 0 if you just want to see the report without failing the build
          ignore-unfixed: true
          severity: 'CRITICAL' # Only fail if something EXTREMELY bad is found
